<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --f900: #1a3020;
  --f800: #24452e;
  --f700: #2f5c3c;
  --f600: #3a744b;
  --f400: #6aab7c;
  --f200: #b8dcc4;
  --f50:  #f2f9f4;
  --sand: #fdf8f0;
  --line: #d8d0c4;
}
@page { size: A4 portrait; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  background: #e8e2d8;
  color: #1e2d1e;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* 印刷ボタン */
.print-bar {
  background: var(--f800);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.print-bar span { color: var(--f200); font-size: 12px; }
.print-btn {
  background: var(--f600);
  color: white;
  border: none;
  padding: 7px 20px;
  border-radius: 5px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.print-btn:hover { background: var(--f400); }
@media print { .print-bar { display: none; } }

/* 用紙 */
.page {
  width: 210mm;
  min-height: 297mm;
  margin: 10mm auto;
  background: white;
  padding: 14mm 16mm 12mm;
  display: flex;
  flex-direction: column;
  gap: 7mm;
  box-shadow: 0 4px 32px rgba(0,0,0,0.12);
}
@media print {
  body { background: white; }
  .page { margin: 0; box-shadow: none; padding: 12mm 14mm 10mm; }
}

/* タイトル */
.doc-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 26pt;
  font-weight: 800;
  color: var(--f900);
  text-align: center;
  letter-spacing: 0.3em;
  border-bottom: 2.5px solid var(--f800);
  padding-bottom: 4mm;
}

/* メタ情報 */
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 6mm;
}
.client-block { flex: 1; }
.client-block .to-label {
  font-size: 8pt;
  color: var(--f600);
  margin-bottom: 1mm;
}
.client-name {
  font-size: 14pt;
  font-weight: 700;
  color: var(--f900);
  border-bottom: 1.5px solid var(--f800);
  padding-bottom: 1mm;
  min-width: 60mm;
}
.client-name:focus { outline: none; border-bottom-color: var(--f600); }

.info-block {
  min-width: 58mm;
  display: flex;
  flex-direction: column;
  gap: 2mm;
}
.info-row {
  display: flex;
  align-items: center;
  gap: 2mm;
  font-size: 8pt;
}
.info-row .lbl {
  color: var(--f600);
  white-space: nowrap;
  min-width: 14mm;
}
.info-row .val {
  border-bottom: 1px solid var(--line);
  flex: 1;
  min-width: 30mm;
  padding-bottom: 0.5mm;
  color: var(--f900);
}
.info-row .val:focus { outline: none; border-bottom-color: var(--f600); }

/* 現場・件名 */
.subject-row {
  display: flex;
  align-items: center;
  gap: 3mm;
  background: var(--f50);
  border: 1.5px solid var(--f200);
  border-radius: 5px;
  padding: 3mm 5mm;
}
.subject-row .lbl {
  font-size: 8pt;
  font-weight: 700;
  color: var(--f700);
  white-space: nowrap;
}
.subject-val {
  font-size: 11pt;
  font-weight: 700;
  color: var(--f900);
  flex: 1;
  border: none;
  background: transparent;
  font-family: inherit;
}
.subject-val:focus { outline: none; }

/* 明細テーブル */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 8.5pt;
}
thead tr {
  background: var(--f800);
  color: white;
}
thead th {
  padding: 2.5mm 3mm;
  font-weight: 700;
  font-size: 7.5pt;
}
thead th:nth-child(1) { width: 44%; text-align: left; }
thead th:nth-child(2) { width: 12%; text-align: center; }
thead th:nth-child(3) { width: 12%; text-align: center; }
thead th:nth-child(4) { width: 20%; text-align: right; }
thead th:nth-child(5) { width: 12%; text-align: left; }

tbody tr { border-bottom: 1px solid var(--line); }
tbody tr:nth-child(even) { background: var(--sand); }
tbody td { padding: 2mm 3mm; }
tbody td input {
  width: 100%;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 8.5pt;
  color: var(--f900);
  padding: 0;
}
tbody td input:focus { outline: none; background: #f0f9f4; }
tbody td input.num { text-align: right; }
tbody td.amount { text-align: right; font-weight: 500; color: var(--f800); padding-right: 4mm; }
tbody td.note-cell input { color: #6b7280; }

/* 合計エリア */
.total-section {
  display: flex;
  justify-content: flex-end;
}
.total-table {
  width: 72mm;
  border-collapse: collapse;
  font-size: 8.5pt;
}
.total-table tr { border-bottom: 1px solid var(--line); }
.total-table td { padding: 2mm 4mm; }
.total-table td:first-child { color: var(--f600); }
.total-table td:last-child { text-align: right; font-weight: 500; color: var(--f900); }
.total-table tr.grand {
  background: var(--f900);
}
.total-table tr.grand td {
  color: white;
  font-weight: 700;
  font-size: 10pt;
  padding: 3mm 4mm;
}
.total-table tr.grand td:last-child { font-family: 'Shippori Mincho', serif; font-size: 13pt; }

/* 備考 */
.note-section {
  border: 1.5px solid var(--line);
  border-radius: 5px;
  padding: 4mm 5mm;
  flex: 1;
}
.note-section .lbl {
  font-size: 7.5pt;
  font-weight: 700;
  color: var(--f600);
  margin-bottom: 2mm;
}
.note-textarea {
  width: 100%;
  border: none;
  font-family: inherit;
  font-size: 8pt;
  color: #374151;
  line-height: 1.8;
  resize: none;
  background: transparent;
  min-height: 14mm;
}
.note-textarea:focus { outline: none; }

/* フッター */
.footer {
  border-top: 1px solid var(--line);
  padding-top: 3mm;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer .co-name {
  font-size: 9pt;
  font-weight: 700;
  color: var(--f800);
}
.footer .co-info {
  font-size: 7pt;
  color: #6b7280;
  text-align: right;
}
</style>
</head>
<body>

<div class="print-bar">
  <span>入力後、印刷ボタンまたは Ctrl+P で印刷・PDF保存できます</span>
  <button class="print-btn" onclick="window.print()">印刷 / PDF保存</button>
</div>

<div class="page">

  <!-- タイトル -->
  <div class="doc-title">御　見　積　書</div>

  <!-- メタ情報 -->
  <div class="meta-row">
    <div class="client-block">
      <div class="to-label">お客様名</div>
      <div class="client-name" contenteditable="true" data-placeholder="　　　　　　　　　　　　　　　　　様"></div>
    </div>
    <div class="info-block">
      <div class="info-row">
        <span class="lbl">見積日：</span>
        <span class="val" contenteditable="true" id="doc-date"></span>
      </div>
      <div class="info-row">
        <span class="lbl">有効期限：</span>
        <span class="val" contenteditable="true">発行日より30日間</span>
      </div>
      <div class="info-row">
        <span class="lbl">見積番号：</span>
        <span class="val" contenteditable="true"></span>
      </div>
    </div>
  </div>

  <!-- 現場・件名 -->
  <div class="subject-row">
    <span class="lbl">現場・件名：</span>
    <input type="text" class="subject-val" placeholder="例：K翔 駐車場 水脈整備工事">
  </div>

  <!-- 明細テーブル -->
  <table id="estimate-table">
    <thead>
      <tr>
        <th>施工内容</th>
        <th style="text-align:center;">数量</th>
        <th style="text-align:center;">単位</th>
        <th style="text-align:right;">単価（円）</th>
        <th style="text-align:left;">備考</th>
      </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
  </table>

  <!-- 行追加ボタン（印刷時非表示） -->
  <div style="display:flex; gap:8px;" class="no-print">
    <button onclick="addRow()" style="font-size:11px; padding:5px 14px; border:1.5px solid var(--f400); border-radius:4px; background:var(--f50); color:var(--f700); cursor:pointer; font-family:inherit;">＋ 行を追加</button>
    <button onclick="removeRow()" style="font-size:11px; padding:5px 14px; border:1.5px solid var(--line); border-radius:4px; background:white; color:#6b7280; cursor:pointer; font-family:inherit;">− 最終行を削除</button>
  </div>
  <style>@media print { .no-print { display: none !important; } }</style>

  <!-- 合計 -->
  <div class="total-section">
    <table class="total-table">
      <tr>
        <td>小計</td>
        <td id="subtotal">¥0</td>
      </tr>
      <tr>
        <td>消費税（10%）</td>
        <td id="tax">¥0</td>
      </tr>
      <tr class="grand">
        <td>合計金額</td>
        <td id="total">¥0</td>
      </tr>
    </table>
  </div>

  <!-- 備考 -->
  <div class="note-section">
    <div class="lbl">備考・条件</div>
    <textarea class="note-textarea" rows="3" placeholder="・材料費は別途実費となります&#10;・施工後に写真記録と観察レポートをお渡しします&#10;・交通費は現場により別途ご相談"></textarea>
  </div>

  <!-- フッター -->
  <div class="footer">
    <div class="co-name">環境整備事業</div>
    <div class="co-info" contenteditable="true">連絡先・担当者名をここに入力</div>
  </div>

</div>

<script>
// 今日の日付をセット
const today = new Date();
document.getElementById('doc-date').textContent =
  `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;

function formatNum(n) {
  return n === 0 ? '¥0' : '¥' + n.toLocaleString('ja-JP');
}

function calcTotals() {
  let subtotal = 0;
  document.querySelectorAll('.row-amount').forEach(td => {
    const v = parseInt(td.dataset.value || '0');
    subtotal += isNaN(v) ? 0 : v;
  });
  const tax = Math.floor(subtotal * 0.1);
  const total = subtotal + tax;
  document.getElementById('subtotal').textContent = formatNum(subtotal);
  document.getElementById('tax').textContent = formatNum(tax);
  document.getElementById('total').textContent = formatNum(total);
}

function calcRow(row) {
  const qty = parseFloat(row.querySelector('.inp-qty').value) || 0;
  const price = parseFloat(row.querySelector('.inp-price').value.replace(/,/g, '')) || 0;
  const amount = Math.round(qty * price);
  const td = row.querySelector('.row-amount');
  td.textContent = amount > 0 ? formatNum(amount) : '';
  td.dataset.value = amount;
  calcTotals();
}

function addRow() {
  const tbody = document.getElementById('table-body');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" placeholder="例：水脈整備（浅溝・点穴）"></td>
    <td><input type="text" class="inp-qty num" placeholder="1"></td>
    <td><input type="text" placeholder="式"></td>
    <td><input type="text" class="inp-price num" placeholder="25,000"></td>
    <td class="note-cell"><input type="text" placeholder=""></td>
    <td class="amount row-amount" data-value="0"></td>
  `;
  tr.querySelector('.inp-qty').addEventListener('input', () => calcRow(tr));
  tr.querySelector('.inp-price').addEventListener('input', () => calcRow(tr));
  tbody.appendChild(tr);
}

function removeRow() {
  const tbody = document.getElementById('table-body');
  if (tbody.rows.length > 1) {
    tbody.deleteRow(tbody.rows.length - 1);
    calcTotals();
  }
}

// 初期行を追加
for (let i = 0; i < 6; i++) addRow();
</script>
</body>
</html>
